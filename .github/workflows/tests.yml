name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --ansi
          chmod -R 777 storage bootstrap/cache

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Setiap pemeriksaan dijalankan sebagai step terpisah agar step yang gagal
      # langsung terlihat di GitHub Actions, dan step lain tetap dijalankan.
      - name: PHPStan
        if: ${{ !cancelled() }}
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Pint (PHP code style)
        if: ${{ !cancelled() }}
        run: ./vendor/bin/pint --parallel --test

      - name: TypeScript type check
        if: ${{ !cancelled() }}
        run: npm run types:check

      - name: Vite+ lint & format check
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Pest tests
        if: ${{ !cancelled() }}
        run: php artisan test
